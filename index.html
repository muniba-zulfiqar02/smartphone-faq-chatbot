<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartPhone FAQ Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 420px;
      background: #1a1a2e;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 600px;
    }

    .chat-header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      padding: 20px;
      text-align: center;
      color: white;
    }

    .chat-header h2 { font-size: 1.2rem; }
    .chat-header p  { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bot-message {
      background: #2d2d44;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }

    .user-message {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    .chat-input {
      display: flex;
      padding: 16px;
      gap: 10px;
      background: #16162a;
      border-top: 1px solid #2d2d44;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #3d3d5c;
      background: #2d2d44;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .chat-input input::placeholder { color: #888; }

    .chat-input input:focus {
      border-color: #6366f1;
    }

    .chat-input button {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .chat-input button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h2>📱 SmartPhone FAQ Chatbot</h2>
      <p>Ask me anything about the phone!</p>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot-message">
        👋 Hi! I'm your SmartPhone FAQ Assistant. Ask me about battery, camera, price, warranty and more!
      </div>
    </div>

    <div class="chat-input">
      <input
        type="text"
        id="userInput"
        placeholder="Type your question..."
        onkeypress="if(event.key==='Enter') sendMessage()"
      />
      <button onclick="sendMessage()">Send 🚀</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const messages = document.getElementById('chatMessages');
      const userText = input.value.trim();
      if (!userText) return;

      // Show user message
      messages.innerHTML += `<div class="message user-message">${userText}</div>`;
      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      // Get bot response
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: userText })
      });

      const data = await res.json();
      messages.innerHTML += `<div class="message bot-message">${data.response}</div>`;
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
